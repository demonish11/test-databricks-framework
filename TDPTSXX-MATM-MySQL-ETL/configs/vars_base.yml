variables:
  Databricks_Env:
    default: dev
    description: Deployment environment code (dev/tst/stg/prd).

  MySql_Jdbc_Jar_Path:
    default: /Volumes/ent_dtlk_dev/volumes/jdbc-jars/mysql-connector-j-8.3.0.jar
    description: MySQL JDBC jar path for the current workspace.

  Loadtracker_Target_Catalog:
    default: ent_dtlk_dev
    description: Unity Catalog catalog for load tracking.

  Loadtracker_Target_Schema:
    default: monitoring
    description: Schema for load tracking objects.

  Loadtracker_Target_Table:
    default: load_tracking_s0transportxxx
    description: Table used to persist load tracking watermarks.

  Job_Timezone:
    default: America/New_York
    description: Timezone for scheduled jobs.

  Hourly_Cron_Schedule:
    default: '12 15 * * * ?'
    description: Hourly/transactional MySQL extract schedule.

  Daily_Cron_Schedule:
    default: '9 0 22 * * ?'
    description: Daily MySQL extract schedule.

  Daily_Source_Config_Path:
    default: ${workspace.root_path}/files/src/configs/mysql_extract_daily.json
    description: Path to daily MySQL entity configuration.

  Transactional_Source_Config_Path:
    default: ${workspace.root_path}/files/src/configs/mysql_extract_hourly.json
    description: Path to hourly/transactional MySQL entity configuration.

  Target_Config_Path:
    default: ${workspace.root_path}/files/src/configs/mysql_source_stub.json
    description: Path to MySQL source connection/auth stub.
