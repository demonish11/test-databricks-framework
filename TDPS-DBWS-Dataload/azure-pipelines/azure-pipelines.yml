pool: ubuntu-latest-publix

stages:
- stage: Dev
  displayName: Dev
  jobs:
  - template: templates/deploy_template.yml
    parameters:
      publixEnvironment: DEV_East
      azdoEnvironment: DEV_S0TDPSXX
      azureSubscription: s0tdpsxx-01-dev
      keyVaultName: cutdkyvtdbwss0tdpsxx01
      patSecretName: cutddbwstransp01-databricks-pat
