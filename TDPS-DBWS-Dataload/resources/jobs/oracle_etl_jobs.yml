resources:
  jobs:
    TDPS_Mod_Initial_Load:
      name: TDPS Mod Initial Load
      parameters:
        quartz_cron_expression: ${var.Transactional_Cron_Schedule}
        timezone_id: ${var.Job_Timezone}
        pause_status: PAUSED
      parameters:
        - name: entity_name
          default: ""
      job_clusters:
        - job_cluster_key: Oracle_ETL_Cluster
          new_cluster:
            cluster_name: ''
            spark_version: 14.3.x-scala2.12
            azure_attributes:
              first_on_demand: 1
              availability: SPOT_WITH_FALLBACK_AZURE
              spot_bid_max_price: -1
            node_type_id: Standard_D4ds_v5
            spark_env_vars:
              PYSPARK_PYTHON: /databricks/python3/bin/python3
              Databricks_Env: ${var.Databricks_Env}
              Loadtracker_Target_Catalog: ${var.Loadtracker_Target_Catalog}
              Loadtracker_Target_Schema: ${var.Loadtracker_Target_Schema}
              Loadtracker_Target_Table: ${var.Loadtracker_Target_Table}
            enable_elastic_disk: true
            data_security_mode: USER_ISOLATION
            num_workers: 4
      tasks:
        - task_key: Extract_Transactional
          notebook_task:
            notebook_path: ${workspace.root_path}/files/src/Extracts_Wrapper
            source: WORKSPACE
            base_parameters:
              load_mode: transactional
              source_config_path: ${var.Transactional_Source_Config_Path}
              target_config_path: ${var.Target_Config_Path}
              entity_name: '{{job.parameters.entity_name}}'
              watermark_column: ${var.Watermark_Column}
              transactional_window_minutes: ${var.Transactional_Window_Minutes}
          job_cluster_key: Oracle_ETL_Cluster
          libraries:
            - jar: ${var.Oracle_Jdbc_Jar_Path}
        - task_key: Transform_Transactional
          depends_on:
            - task_key: Extract_Transactional
          notebook_task:
            notebook_path: ${workspace.root_path}/files/src/Transforms_Wrapper
            source: WORKSPACE
            base_parameters:
              load_mode: transactional
              source_config_path: ${var.Transactional_Source_Config_Path}
              target_config_path: ${var.Target_Config_Path}
              entity_name: '{{job.parameters.entity_name}}'
          job_cluster_key: Oracle_ETL_Cluster
        - task_key: Complete_Transactional
          depends_on:
            - task_key: Transform_Transactional
          notebook_task:
            notebook_path: ${workspace.root_path}/files/src/Completion
            source: WORKSPACE
            base_parameters:
              load_mode: transactional
              source_config_path: ${var.Transactional_Source_Config_Path}
              target_config_path: ${var.Target_Config_Path}
              entity_name: '{{job.parameters.entity_name}}'
          job_cluster_key: Oracle_ETL_Cluster
      queue:
        enabled: true
      timeout_seconds: 86400

