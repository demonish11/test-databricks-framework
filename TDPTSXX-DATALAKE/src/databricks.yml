bundle:
  name: DataLoad

variables:
  Databricks_Env:
  Loadtracker_Target_Catalog:
  Loadtracker_Target_Schema:
  Loadtracker_Target_Table:


resources:
  jobs:
    S0TDPSXX_Hourly_Extraction:
      name: 'S0TDPSXX Hourly Extraction'
      tasks:
      - task_key: S0TDPSXX_Hourly_Extraction
        notebook_task:
          notebook_path: /Workspace/S0TDPSXX/files/src/Wrapper
          source: WORKSPACE
        job_cluster_key: Compute_S0TDPSXX_Hourly_Extract
        libraries:
        - jar: /Volumes/${var.Loadtracker_Target_Catalog}/volumes/jdbc-jars/ojdbc7.jar
      queue:
        enabled: true

    S0TDPSXX_Hourly_Backfill:
      name: 'S0TDPSXX Hourly Backfill'
      tasks:
      - task_key: S0TDPSXX_Hourly_Backfill
        notebook_task:
          notebook_path: /Workspace/S0TDPSXX/files/src/Wrapper_Backfill
          source: WORKSPACE
        job_cluster_key: Compute_S0TDPSXX_Hourly_Backfill
        libraries:
        - jar: /Volumes/${var.Loadtracker_Target_Catalog}/volumes/jdbc-jars/ojdbc7.jar
      job_clusters:
      - job_cluster_key: Compute_S0TDPSXX_Hourly_Backfill
        new_cluster:
          cluster_name: ""
          spark_version: 14.3.x-scala2.12
          azure_attributes:
            first_on_demand: 1
            availability: SPOT_WITH_FALLBACK_AZURE
            spot_bid_max_price: -1
          node_type_id: Standard_D4ds_v5
          spark_env_vars:
            PYSPARK_PYTHON: /databricks/python3/bin/python3
            Databricks_Env: ${var.Databricks_Env}
            Loadtracker_Target_Catalog: ${var.Loadtracker_Target_Catalog}
            Loadtracker_Target_Schema: ${var.Loadtracker_Target_Schema}
            Loadtracker_Target_Table: ${var.Loadtracker_Target_Table}
            DataMapping_File: ./datamapping_Hourly_Backfill.json
          enable_elastic_disk: true
          data_security_mode: USER_ISOLATION
          num_workers: 8
      timeout_seconds: 86400
      queue:
        enabled: true

    S0TDPSXX_Daily_Extraction:
      name: 'S0TDPSXX Daily Extraction'
      tasks:
      - task_key: S0TDPSXX_Daily_Extraction
        notebook_task:
          notebook_path: /Workspace/S0TDPSXX/files/src/Wrapper
          source: WORKSPACE
        job_cluster_key: Compute_TDPS_Daily_Extract
        libraries:
        - jar: /Volumes/${var.Loadtracker_Target_Catalog}/volumes/jdbc-jars/ojdbc7.jar
      queue:
        enabled: true

    S0TDPSXX_Trip_Delete_Detection:
      name: 'S0TDPSXX Trip Delete Detection'
      tasks:
      - task_key: S0TDPSXX_Trip_Delete_Detection
        notebook_task:
          notebook_path: /Workspace/S0TDPSXX/files/src/Trip_Delete_Detection
          source: WORKSPACE
        job_cluster_key: Compute_TDPS_Trip_Delete_Detection
        libraries:
        - jar: /Volumes/${var.Loadtracker_Target_Catalog}/volumes/jdbc-jars/ojdbc7.jar
      job_clusters:
      - job_cluster_key: Compute_TDPS_Trip_Delete_Detection
        new_cluster:
          cluster_name: ""
          spark_version: 14.3.x-scala2.12
          azure_attributes:
            first_on_demand: 1
            availability: SPOT_WITH_FALLBACK_AZURE
            spot_bid_max_price: -1
          node_type_id: Standard_D4ds_v5
          spark_env_vars:
            PYSPARK_PYTHON: /databricks/python3/bin/python3
            Databricks_Env: ${var.Databricks_Env}
            Loadtracker_Target_Catalog: ${var.Loadtracker_Target_Catalog}
            Loadtracker_Target_Schema: ${var.Loadtracker_Target_Schema}
            Loadtracker_Target_Table: ${var.Loadtracker_Target_Table}
          enable_elastic_disk: true
          data_security_mode: USER_ISOLATION
          num_workers: 8
      queue:
        enabled: true

    S0TDPSXX_AzureSql_Hourly_Extraction:
      name: 'S0TDPSXX Azure SQL Hourly Extraction'
      tasks:
      - task_key: S0TDPSXX_AzureSql_Hourly_Extraction
        notebook_task:
          notebook_path: /Workspace/S0TDPSXX/files/src/Wrapper
          source: WORKSPACE
        job_cluster_key: Compute_S0TDPSXX_AzureSql_Hourly_Extract
        libraries:
        - maven:
            coordinates: com.microsoft.sqlserver:mssql-jdbc:12.6.1.jre11
      queue:
        enabled: true

    S0TDPSXX_AzureSql_Daily_Extraction:
      name: 'S0TDPSXX Azure SQL Daily Extraction'
      tasks:
      - task_key: S0TDPSXX_AzureSql_Daily_Extraction
        notebook_task:
          notebook_path: /Workspace/S0TDPSXX/files/src/Wrapper
          source: WORKSPACE
        job_cluster_key: Compute_S0TDPSXX_AzureSql_Daily_Extract
        libraries:
        - maven:
            coordinates: com.microsoft.sqlserver:mssql-jdbc:12.6.1.jre11
      queue:
        enabled: true


